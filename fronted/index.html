<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ All Tools AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="mainApp">
        <div class="container">
            <header>
                <div class="header-left">
                    <h1>✨ All Tools AI</h1>
                    <p>Free AI Tools for Everyone</p>
                </div>
                <div class="header-right">
                    <span class="limit-badge" id="limitBadge">🔋 10/10</span>
                    <button id="themeToggle" class="theme-btn"><i class="fas fa-moon"></i></button>
                </div>
            </header>

            <div class="stats-bar">
                <div class="stat-item"><i class="fas fa-tools"></i> <span id="totalTools">0</span> Tools</div>
                <div class="stat-item"><i class="fas fa-upload"></i> <span id="totalUsage">0</span> Used</div>
                <div class="stat-item"><i class="fas fa-clock"></i> <span id="resetTime">Resets at 00:00</span></div>
            </div>

            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search tools by name or category...">
            </div>

            <div class="categories" id="categoriesContainer">
                <button class="category-btn active" data-category="all">All</button>
            </div>

            <div class="tools-grid" id="toolsGrid"></div>

            <div class="modal" id="toolModal" style="display: none;">
                <div class="modal-content">
                    <span class="modal-close">&times;</span>
                    <h2 id="modalTitle">Tool Name</h2>
                    <div id="modalBody"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" style="display: none;"></div>

    <script src="script.js"></script>
</body>
</html>
