<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ All Tools AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="login-container">
        <div class="login-box">
            <h1>🔐 All Tools AI</h1>
            <p>Enter username to continue</p>
            <input type="text" id="usernameInput" placeholder="Username" class="login-input">
            <button id="loginBtn" class="login-btn">Login</button>
            <div id="loginError" class="login-error"></div>
            <div class="login-info">
                <i class="fas fa-info-circle"></i> Username: admin
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" style="display: none;">
        <div class="container">
            <header>
                <div class="header-left">
                    <h1>✨ All Tools AI</h1>
                    <p>Transform your images with AI</p>
                </div>
                <div class="header-right">
                    <button id="themeToggle" class="theme-btn"><i class="fas fa-moon"></i></button>
                    <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </header>

            <!-- Stats Bar -->
            <div class="stats-bar">
                <div class="stat-item">
                    <i class="fas fa-tools"></i>
                    <span id="totalTools">0</span> Tools
                </div>
                <div class="stat-item">
                    <i class="fas fa-clock"></i>
                    <span id="lastUpdate">Just now</span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-user"></i>
                    <span id="currentUserDisplay">admin</span>
                </div>
            </div>

            <!-- Search -->
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search tools by name or category...">
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <button onclick="showFavorites()" class="quick-btn"><i class="fas fa-star"></i> Favorites</button>
                <button onclick="showHistory()" class="quick-btn"><i class="fas fa-history"></i> History</button>
                <button onclick="clearHistory()" class="quick-btn"><i class="fas fa-trash"></i> Clear History</button>
            </div>

            <!-- Categories -->
            <div class="categories" id="categoriesContainer">
                <button class="category-btn active" data-category="all">All</button>
            </div>

            <!-- Tools Grid -->
            <div class="tools-grid" id="toolsGrid">
                <!-- Tools will be rendered here -->
            </div>

            <!-- Tool Detail Modal -->
            <div class="modal" id="toolModal" style="display: none;">
                <div class="modal-content">
                    <span class="modal-close">&times;</span>
                    <h2 id="modalTitle">Tool Name</h2>
                    <div id="modalBody">
                        <!-- Dynamic content -->
                    </div>
                </div>
            </div>

            <!-- Add Tool Modal (Admin) -->
            <div class="modal" id="addToolModal" style="display: none;">
                <div class="modal-content modal-large">
                    <span class="modal-close" id="closeAddModal">&times;</span>
                    <h2>➕ Add New Tool</h2>
                    <form id="addToolForm">
                        <div class="form-group">
                            <label>Tool Name</label>
                            <input type="text" id="toolName" required>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <input type="text" id="toolCategory" placeholder="e.g. Image Tools, Fake Tools" required>
                        </div>
                        <div class="form-group">
                            <label>Type</label>
                            <select id="toolType" required>
                                <option value="GET">GET</option>
                                <option value="POST">POST</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Endpoint</label>
                            <input type="text" id="toolEndpoint" placeholder="/imagecreator/upscale" required>
                        </div>
                        <div class="form-group">
                            <label>JSON Response Example</label>
                            <textarea id="toolJson" rows="4" required>{"status":true,"result":"..."}</textarea>
                        </div>
                        <div class="form-group">
                            <label>Query Parameter (optional)</label>
                            <input type="text" id="toolQuery" placeholder="{query}">
                        </div>
                        <div class="form-group">
                            <label>Query Example (optional)</label>
                            <input type="text" id="toolQueryExample" placeholder="9000">
                        </div>
                        <button type="submit" class="btn-add-tool">Add Tool</button>
                    </form>
                </div>
            </div>

            <!-- History Modal -->
            <div class="modal" id="historyModal" style="display: none;">
                <div class="modal-content">
                    <span class="modal-close" id="closeHistoryModal">&times;</span>
                    <h2><i class="fas fa-history"></i> History</h2>
                    <div id="historyList" style="max-height:400px;overflow-y:auto;margin-top:16px;">
                        <p style="text-align:center;color:#999;">No history yet</p>
                    </div>
                </div>
            </div>

            <!-- Favorites Modal -->
            <div class="modal" id="favoritesModal" style="display: none;">
                <div class="modal-content">
                    <span class="modal-close" id="closeFavoritesModal">&times;</span>
                    <h2><i class="fas fa-star"></i> Favorites</h2>
                    <div id="favoritesList" style="max-height:400px;overflow-y:auto;margin-top:16px;">
                        <p style="text-align:center;color:#999;">No favorites yet</p>
                    </div>
                </div>
            </div>

            <button id="addToolBtn" class="float-btn" title="Add New Tool">
                <i class="fas fa-plus"></i>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
